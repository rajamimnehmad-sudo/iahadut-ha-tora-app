 y dulces","pending":false,"issue":""}]}</script>
  <script>
    (()=>{
      const root=document.getElementById('catalogo-completo-ordenado');
      const rows=JSON.parse(root.querySelector('#complete-data').textContent).rows;
      const directory=root.querySelector('#complete-directory');
      const status=root.querySelector('#complete-status');
      const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const isOil=family=>/^Aceites?(?:\s|$)/.test(family)||family==='Otros aceites';
      const oilType=product=>/\baceites?\s+en\s+aerosol\b/i.test(product.title)?'Aceites en aerosol':(['Aceite de girasol','Aceite de oliva','Aceites mezcla'].includes(product.family)?product.family:'Otros aceites');
      const isDressing=product=>['Aderezos','Mayonesas','Ketchup','Mostaza'].includes(product.family);
      const dressingType=product=>/^mayonesa\b/i.test(product.title)?'Mayonesas':(/^ketchup\b/i.test(product.title)?'Ketchup':(/^mostaza\b/i.test(product.title)?'Mostaza':(/^salsa golf\b/i.test(product.title)?'Salsa golf':(/^salsa barbacoa\b/i.test(product.title)?'Salsa barbacoa':'Otros aderezos'))));
      const powderedJuiceIds=new Set([307,308,309,310,311,312,313,314,315,316,317,318,319,320,321]);
      const separateBakingIds=new Set([737,751]);
      const alcoholFamilies=new Set(['Arak y anisados','Cachaças','Aguardientes','Otros destilados','Gins','Licores','Rones','Tequilas','Vodkas','Whiskies','Vinos','Espumantes','Cervezas']);
      const alcoholType=product=>['Cachaças','Aguardientes','Otros destilados'].includes(product.family)?null:product.family;
      const condimentFamilies=new Set(['Azafrán','Canela','Clavo de olor','Curry','Jengibre','Nuez moscada','Perejil','Pimentón','Pimientas','Cebolla deshidratada']);
      const extraCondimentIds=new Set([827,830,831]);
      const mainFamily=product=>{
        if(product.id===627)return 'Vegetales deshidratados';
        if(product.id===1052)return 'Pastas dulces';
        if(condimentFamilies.has(product.family)||extraCondimentIds.has(product.id))return 'Condimentos';
        if(product.family==='Maíz y polenta'&&/^polenta\b/i.test(product.title))return 'Polenta';
        if(product.family==='Cervezas'&&/sin alcohol/i.test(product.title))return 'Cervezas sin alcohol';
        if(alcoholFamilies.has(product.family))return 'Bebidas alcohólicas';
        if(product.family==='Vegetales congelados')return 'Verduras congeladas';
        if(product.family==='Surtidos de dietética')return 'Productos de dietética';
        if(product.id===609)return 'Almidones y féculas';
        if(/^papas (?:super )?co(?:n)?geladas\b/i.test(product.title))return 'Papas congeladas';
        if(/^pochoclos\b/i.test(product.title))return 'Pochoclos';
        if(separateBakingIds.has(product.id))return 'Bicarbonato y polvo de hornear';
        if(product.family==='Levaduras y leudantes')return 'Levaduras';
        if(powderedJuiceIds.has(product.id))return 'Jugo en polvo';
        if(/^jugo de uva\b/i.test(product.title))return 'Jugo de uva';
        if(isOil(product.family))return 'Aceites';
        if(isDressing(product))return 'Aderezos';
        return {'Aguardientes':'Otros destilados','Ajo y preparados de ajo':'Condimentos','Otras hierbas y especias':'Condimentos','Almendras y derivados · ficha mixta':'Frutos secos','Arak y anisados':'Bebidas alcohólicas','Cachaças':'Bebidas alcohólicas','Dulces de fruta':'Dulces de batata y membrillo','Hongos en conserva':'Champiñones'}[product.family]||product.family;
      };
      const families=[...new Set(rows.map(mainFamily))].sort((a,b)=>a.localeCompare(b,'es'));
      const saved=window.openai?.widgetState?.privateContent;
      const initial=Array.isArray(saved?.openFamilies)?saved.openFamilies:['Aceites','Aceites › Aceite de girasol','Aceites › Aceite de oliva','Aderezos','Aderezos › Mayonesas','Aderezos › Ketchup','Puré de tomate'];
      const oilWasOpen=initial.some(name=>isOil(name));
      if(oilWasOpen && !initial.includes('Aceites'))initial.push('Aceites');
      root.querySelector('#complete-count').textContent=`${rows.length.toLocaleString('es-AR')} entradas · ${families.length} categorías principales · Aceites, Aderezos y Bebidas alcohólicas con subcategorías · propuesta sin publicar`;
      const productList=products=>`<ul class="products">${products.map(p=>`<li data-product-id="${p.id}"><span>${escape(p.title)}</span>${p.pending?'<div class="text-small review">Ficha pendiente de revisión</div>':''}${p.issue && !p.pending?`<div class="previous text-small">Antes: ${escape(p.actual)}</div>`:''}</li>`).join('')}</ul>`;
      directory.innerHTML=families.map(family=>{
        const products=rows.filter(p=>mainFamily(p)===family).sort((a,b)=>a.title.localeCompare(b.title,'es')||a.id-b.id);
        let content=productList(products);
        if(family==='Bebidas alcohólicas')content=productList(products.filter(p=>alcoholType(p)===null))+'<div class="oil-types">'+[...new Set(products.map(alcoholType))].filter(type=>type!==null).sort((a,b)=>a.localeCompare(b,'es')).map(type=>{
          const key=`Bebidas alcohólicas › ${type}`;
          const items=products.filter(p=>alcoholType(p)===type);
          return `<details class="category" data-family="${escape(key)}" ${initial.includes(key)||initial.includes(type)?'open':''}><summary class="cursor-interaction">${escape(type)}<span class="category-count text-small">${items.length}</span></summary>${productList(items)}</details>`;
        }).join('')+'</div>';
        if(family==='Aceites')content='<div class="oil-types">'+['Aceite de girasol','Aceite de oliva','Aceites mezcla','Aceites en aerosol','Otros aceites'].map(type=>{
          const key=`Aceites › ${type}`;
          const items=products.filter(p=>oilType(p)===type);
          return `<details class="category" data-family="${escape(key)}" ${initial.includes(key)||initial.includes(type)?'open':''}><summary class="cursor-interaction">${escape(type)}<span class="category-count text-small">${items.length}</span></summary>${productList(items)}</details>`;
        }).join('')+'</div>';
        if(family==='Aderezos')content='<div class="oil-types">'+['Mayonesas','Ketchup','Mostaza','Salsa golf','Salsa barbacoa','Otros aderezos'].filter(type=>products.some(p=>dressingType(p)===type)).map(type=>{
          const key=`Aderezos › ${type}`;
          const items=products.filter(p=>dressingType(p)===type);
          return `<details class="category" data-family="${escape(key)}" ${initial.includes(key)||initial.includes(type)?'open':''}><summary class="cursor-interaction">${escape(type)}<span class="category-count text-small">${items.length}</span></summary>${productList(items)}</details>`;
        }).join('')+'</div>';
        return `<details class="category" data-family="${escape(family)}" ${initial.includes(family)?'open':''}><summary class="cursor-interaction">${escape(family)}<span class="category-count text-small">${products.length}</span></summary>${content}</details>`;
      }).join('');
      let restoring=false;
      function save(){
        if(restoring)return;
        const openFamilies=[...directory.querySelectorAll('details[open]')].map(p=>p.dataset.family);
        status.textContent=`${openFamilies.length} categorías desplegadas · ningún producto omitido`;
        window.openai?.setWidgetState?.({modelContent:{catalogo:'completo',categorias:families.length,entradas:rows.length},privateContent:{openFamilies}})?.catch(()=>{});
      }
      const details=[...directory.querySelectorAll('details')];
      status.textContent=`${details.filter(p=>p.open).length} categorías desplegadas · ningún producto omitido`;
      directory.addEventListener('click',event=>{if(event.target.closest('summary'))setTimeout(save,0);});
      root.querySelector('#complete-expand').addEventListener('click',()=>{for(const detail of details)detail.open=true;save();});
      root.querySelector('#complete-collapse').addEventListener('click',()=>{for(const detail of details)detail.open=false;save();});
      window.addEventListener('openai:set_globals',event=>{
        const open=event.detail?.globals?.widgetState?.privateContent?.openFamilies;
        if(!Array.isArray(open))return;
        restoring=true;
        for(const detail of details)detail.open=open.includes(detail.dataset.family);
        restoring=false;
      });
    })();
  </script>
</div>
