apply plugin: 'com.android.application'

android {
    namespace = "ar.vaad.catalogo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ar.vaad.catalogo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 45
        versionName "0.11.30"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def signingProperties = new Properties()
    def signingPropertiesPath = project.findProperty('releaseSigningPropertiesPath') ?: System.getenv('RELEASE_SIGNING_PROPERTIES_PATH')
    def signingPropertiesFile = signingPropertiesPath ? file(signingPropertiesPath) : rootProject.file('keystore.properties')
    if (signingPropertiesFile.exists()) {
        signingProperties.load(new FileInputStream(signingPropertiesFile))
    }
    def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def releaseSigningReady = signingPropertiesFile.exists() && requiredSigningProperties.every { key ->
        signingProperties[key]?.toString()?.trim()
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Tests and debug builds must remain runnable without access to release secrets.
    // A release artifact, however, must never be produced accidentally unsigned.
    gradle.taskGraph.whenReady { taskGraph ->
        def requestsReleaseArtifact = taskGraph.allTasks.any { task ->
            task.name in ['assembleRelease', 'bundleRelease']
        }
        if (requestsReleaseArtifact && !releaseSigningReady) {
            throw new GradleException(
                "Falta android/keystore.properties con una firma release completa. " +
                "Configurala antes de generar el AAB de Play."
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
