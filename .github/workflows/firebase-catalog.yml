name: Catálogo Firebase autorizado

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de carga"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - seed
  schedule:
    - cron: '47 */12 * * *'

permissions:
  contents: read

jobs:
  prepare:
    name: Preparar y revisar cambios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Actualizar copia oficial del catálogo
        run: npm run snapshot
      - name: Generar plan sin escribir en Firebase
        run: npm run sync:firebase:catalog
      - name: Guardar paquete para aprobación
        run: |
          mkdir -p firebase-catalog-artifact/web/data
          cp web/data/catalog.json firebase-catalog-artifact/web/data/catalog.json
          cp web/data/product-details.json firebase-catalog-artifact/web/data/product-details.json
          cp web/data/content.json firebase-catalog-artifact/web/data/content.json
      - name: Subir plan y catálogo preparado
        uses: actions/upload-artifact@v4
        with:
          name: firebase-catalog-prepared
          path: firebase-catalog-artifact

  publish:
    name: Aplicar catálogo aprobado en Firebase
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: catalog-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar catálogo preparado
        uses: actions/download-artifact@v4
        with:
          name: firebase-catalog-prepared
          path: prepared
      - name: Instalar dependencias mínimas
        run: npm ci --ignore-scripts
      - name: Aplicar únicamente después de la aprobación del entorno
        env:
          CATALOG_FIREBASE_APPROVED: '1'
          FIREBASE_PROJECT_ID: iahadut-hatora
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          cp prepared/web/data/catalog.json web/data/catalog.json
          cp prepared/web/data/product-details.json web/data/product-details.json
          cp prepared/web/data/content.json web/data/content.json
          if [ "${{ inputs.mode || 'incremental' }}" = "seed" ]; then
            npm run sync:firebase:catalog -- --apply --seed
          else
            npm run sync:firebase:catalog -- --apply
          fi
