name: Actualizar copia del catálogo (sin push)

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Volver a descargar todas las fichas oficiales
        type: boolean
        default: false
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: catalog-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Actualizar catálogo y detalles oficiales
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          npm run snapshot:catalog
          npm run snapshot:content
          if [ "$FORCE_REFRESH" = "true" ]; then
            npm run snapshot:products -- --refresh
            node -e "const s=require('./web/data/product-details.json'); if(s.failures?.length) throw new Error('No se publican fichas incompletas: '+s.failures.length+' fallos');"
          else
            npm run snapshot:products
          fi
          node scripts/publish-catalog-snapshot.mjs
      - name: Guardar catálogo oficial
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "iahadut-alerts[bot]"
          git config user.email "iahadut-alerts[bot]@users.noreply.github.com"
          git add web/data/catalog.json web/data/product-details.json web/data/content.json web/data/published
          git diff --cached --quiet || git commit -m "chore: actualizar catálogo oficial"
          git pull --rebase origin main
          git push
      - name: Mantener la base central con cambios incrementales
        if: github.ref == 'refs/heads/main'
        env:
          CATALOG_FIREBASE_APPROVED: '1'
          FIREBASE_PROJECT_ID: iahadut-hatora
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:firebase:catalog -- --apply
