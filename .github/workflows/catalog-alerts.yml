name: Actualizar copia del catálogo (sin push)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

concurrency:
  group: catalog-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Actualizar catálogo y detalles oficiales
        run: npm run snapshot
      - name: Guardar catálogo oficial
        if: success()
        run: |
          git config user.name "iahadut-alerts[bot]"
          git config user.email "iahadut-alerts[bot]@users.noreply.github.com"
          git add web/data/catalog.json web/data/product-details.json web/data/content.json
          git diff --cached --quiet || git commit -m "chore: actualizar catálogo oficial"
          git pull --rebase origin main
          git push
