name: Publicar Android en prueba interna

on:
  workflow_dispatch:
    inputs:
      release_asset_url:
        description: URL de API del AAB adjunto a un release del repositorio
        required: false
        type: string
      version_code:
        description: Código de versión del AAB que vas a subir
        required: true
        default: '81'
        type: string
      release_version:
        description: Versión visible de la app
        required: true
        default: '1.0.26'
        type: string
      publish:
        description: Subir y publicar el AAB en la pista interna
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - name: Autenticar la cuenta de servicio del proyecto
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

      - name: Preparar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Comprobar acceso a la aplicación y pista interna
        env:
          PACKAGE_NAME: ar.vaad.catalogo.app
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(gcloud auth application-default print-access-token --scopes=https://www.googleapis.com/auth/androidpublisher)
          result=$(curl --silent --show-error -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits")
          status=$(tail -n1 <<<"$result")
          response=$(sed '$d' <<<"$result")
          if [ "$status" != '200' ]; then
            jq '{code:.error.code,status:.error.status,message:.error.message}' <<<"$response"
            exit 1
          fi
          edit_id=$(jq -r '.id' <<<"$response")
          tracks=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id/tracks")
          jq -e '.tracks[] | select(.track == "internal")' <<<"$tracks" >/dev/null
          curl --fail-with-body --silent --show-error -X DELETE \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id"
          echo 'Acceso confirmado para ar.vaad.catalogo.app / internal.'

      - name: Descargar AAB del release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_URL: ${{ inputs.release_asset_url }}
        run: |
          set -euo pipefail
          [[ "$ASSET_URL" =~ ^https://api\.github\.com/repos/rajamimnehmad-sudo/iahadut-ha-tora-app/releases/assets/[0-9]+$ ]]
          gh api "$ASSET_URL" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/iahadut-release.aab"

      - name: Publicar AAB verificado en prueba interna
        if: inputs.publish
        env:
          PACKAGE_NAME: ar.vaad.catalogo.app
          AAB_PATH: ${{ runner.temp }}/iahadut-release.aab
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ACCESS_TOKEN=$(gcloud auth application-default print-access-token --scopes=https://www.googleapis.com/auth/androidpublisher)
          response=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits")
          edit_id=$(jq -r '.id' <<<"$response")
          upload=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$AAB_PATH" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id/bundles?uploadType=media")
          version_code=$(jq -r '.versionCode' <<<"$upload")
          test "$version_code" = "$VERSION_CODE"
          jq -n --arg version "$version_code" --arg name "$RELEASE_VERSION" '{track:"internal",releases:[{name:$name,versionCodes:[$version],status:"completed",releaseNotes:[{language:"es-419",text:"Mejoras del catálogo, fichas sin conexión y avisos manuales."}]}]}' > "$RUNNER_TEMP/track.json"
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/track.json" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id/tracks/internal" >/dev/null
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id:commit" >/dev/null
          echo "Versión $version_code publicada en la pista internal."
