name: Promover Android a producción

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Código de la versión ya probada en la pista interna
        required: true
        default: '79'
        type: string
      release_version:
        description: Versión visible de la app
        required: true
        default: '1.0.26'
        type: string
      publish:
        description: Promover la versión interna indicada a producción
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  production:
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Autenticar la cuenta de servicio del proyecto
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

      - name: Preparar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validar versión interna y promover a producción
        env:
          PACKAGE_NAME: ar.vaad.catalogo.app
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ACCESS_TOKEN=$(gcloud auth application-default print-access-token --scopes=https://www.googleapis.com/auth/androidpublisher)

          response=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits")
          edit_id=$(jq -r '.id' <<<"$response")

          internal=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id/tracks/internal")
          jq -e --arg version "$VERSION_CODE" \
            '.releases[]? | select(.status == "completed") | .versionCodes[]? | select(. == $version)' \
            <<<"$internal" >/dev/null

          jq -n --arg version "$VERSION_CODE" --arg name "$RELEASE_VERSION" \
            '{track:"production",releases:[{name:$name,versionCodes:[$version],status:"completed",releaseNotes:[{language:"es-419",text:"Mejoras del catálogo, fichas sin conexión y avisos manuales."}]}]}' \
            > "$RUNNER_TEMP/production-track.json"

          put_result=$(curl --silent --show-error -w '\n%{http_code}' -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/production-track.json" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id/tracks/production")
          put_status=$(tail -n1 <<<"$put_result")
          put_response=$(sed '$d' <<<"$put_result")
          if [ "$put_status" != '200' ]; then
            jq '{code:.error.code,status:.error.status,message:.error.message,details:.error.details}' <<<"$put_response"
            curl --silent --show-error -X DELETE \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id" >/dev/null
            exit 1
          fi

          commit_result=$(curl --silent --show-error -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$edit_id:commit")
          commit_status=$(tail -n1 <<<"$commit_result")
          commit_response=$(sed '$d' <<<"$commit_result")
          if [ "$commit_status" != '200' ]; then
            jq '{code:.error.code,status:.error.status,message:.error.message,details:.error.details}' <<<"$commit_response"
            exit 1
          fi

          verify_response=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits")
          verify_edit_id=$(jq -r '.id' <<<"$verify_response")
          production=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$verify_edit_id/tracks/production")
          jq -e --arg version "$VERSION_CODE" \
            '.releases[]? | select(.status == "completed") | .versionCodes[]? | select(. == $version)' \
            <<<"$production" >/dev/null
          curl --fail-with-body --silent --show-error -X DELETE \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits/$verify_edit_id"

          echo "Versión $VERSION_CODE confirmada en la pista production."
